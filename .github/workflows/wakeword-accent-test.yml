name: Android accent picker test

on:
  pull_request:
    paths:
      - ".github/workflows/wakeword-accent-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  accent-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download accent preview
        uses: actions/download-artifact@v4
        with:
          name: WakeWord-Android-preview
          run-id: 42493014565
          github-token: ${{ github.token }}
          path: preview
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open accent controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install preview/app-release.apk
            adb logcat -c
            adb shell monkey -p com.temidayoislearning.wakeword 1
            sleep 25
            adb shell input swipe 160 540 160 250 500
            sleep 2
            adb shell uiautomator dump /sdcard/before.xml
            adb shell cat /sdcard/before.xml > before.xml
            python3 -c 'import xml.etree.ElementTree as E,re,subprocess; n=next(x for x in E.parse("before.xml").iter() if x.get("text")=="Accent & voice"); a=list(map(int,re.findall("[0-9]+",n.get("bounds")))); subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)'
            sleep 10
            adb shell uiautomator dump /sdcard/after.xml
            adb shell cat /sdcard/after.xml > after.xml
            adb logcat -d -v brief -s ReactNativeJS AndroidRuntime > accent-log.txt
            cat accent-log.txt
            cat after.xml
            if ! grep -q "Available accents" after.xml; then exit 1; fi
            if grep -q "Something went wrong" after.xml; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wakeword-accent-picker-check
          path: |
            before.xml
            after.xml
            accent-log.txt
          if-no-files-found: ignore
