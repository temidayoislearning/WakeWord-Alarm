name: Android background alarm test

on:
  pull_request:
    paths:
      - ".github/workflows/wakeword-background-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  background-alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the background-voice preview
        uses: actions/download-artifact@v4
        with:
          name: WakeWord-Android-preview
          run-id: 42493014565
          github-token: ${{ github.token }}
          path: preview
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set alarm and verify service starts in background
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install preview/app-release.apk
            echo '' | base64 --decode > /tmp/wakeword_background_probe.py
            python3 /tmp/wakeword_background_probe.py
